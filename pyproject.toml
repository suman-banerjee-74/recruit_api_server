[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standalone-fusion-recruit-api"
version = "0.1.0"
description = "Standalone authenticated Oracle Fusion Recruiting HTTP API"
requires-python = ">=3.10"
dependencies = ["starlette>=1.0,<2", "uvicorn>=0.30,<1", "requests>=2.32.5,<3"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
fusion-recruit-api = "recruit_server.__main__:main"

[tool.setuptools.packages.find]
include = ["recruit_server*"]
